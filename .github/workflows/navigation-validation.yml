name: Navigation first-paint and mobile regression
on:
  push:
    branches: [version-16, production-v16, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [version-16, production-v16]
jobs:
  navigation-browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install Babel==2.17.0 Jinja2==3.1.6 playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Measure original shift and corrected header on real templates
        run: python scripts/test_navigation_browser.py
      - name: Retain navigation previews and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-browser-previews
          path: test-artifacts/navigation/
          if-no-files-found: ignore
          retention-days: 7
