name: Projects and Team Advice publication checks
on:
  push:
    branches: [version-16, production-v16, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [version-16, production-v16]
jobs:
  publications-browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install Babel==2.17.0 Jinja2==3.1.6 playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Validate publication Desk script
        run: node --check erpdevelopers/erp_developers/doctype/erp_developers_publication/erp_developers_publication.js
      - name: Test public pages, reduced footer, review boundaries and bilingual layout
        run: python scripts/test_publications_browser.py
      - name: Retain public-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-browser-previews
          path: test-artifacts/publications/*.png
          if-no-files-found: ignore
          retention-days: 7
