name: Frappe v16 static checks
on:
  push:
    branches: [version-16, "feat/**", "fix/**"]
  pull_request:
    branches: [version-16]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python compile
        run: python -m compileall -q erpdevelopers tests scripts/test_training_browser.py
      - name: Bash syntax
        run: |
          bash -n scripts/install_erptest_lightnode.sh
          bash -n scripts/install_existing_site_erptest_lightnode.sh
          bash -n scripts/update_erptest_lightnode.sh
          bash -n scripts/verify_frontend.sh
          bash -n scripts/install_local_v16.sh
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate meeting calendar and Quick Guide JavaScript
        run: |
          node --check erpdevelopers/public/js/meeting.js
          node --check erpdevelopers/public/js/assistant.js
          node --check erpdevelopers/public/js/catalog.js
          node --test tests/test_catalog_player.mjs
          node --check erpdevelopers/erp_developers/doctype/erp_developers_playlist/erp_developers_playlist.js
  training-browser:
    # Match the operating system supported by the pinned Playwright release.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install isolated browser-test dependencies
        run: |
          python -m pip install Jinja2==3.1.6 playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Test actual Training template in Chromium and Firefox
        run: python scripts/test_training_browser.py
